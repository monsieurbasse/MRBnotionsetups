<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; text-align:center; background:#fff; }
  img { width:100%; max-height:300px; object-fit:cover; }
  button { margin:10px; }
</style>
</head>

<body>
  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
  <br>
  <img id="slide">

<script>
  const photos = [
    "https://picsum.photos/600/300?1",
    "https://picsum.photos/600/300?2",
    "https://picsum.photos/600/300?3"
  ];

  let i = 0;
  const img = document.getElementById("slide");
  img.src = photos[i];

  function next() {
    i = (i + 1) % photos.length;
    img.src = photos[i];
  }

  function prev() {
    i = (i - 1 + photos.length) % photos.length;
    img.src = photos[i];
  }
</script>
</body>
</html>
